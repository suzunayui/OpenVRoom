server {
    listen 80;
    listen [::]:80;
    server_name openvroom.com;
    root /var/www/openvroom/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/openvroom/access.log;
    error_log /var/log/nginx/openvroom/error.log warn;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /room { return 301 /room/$is_args$args; }
    location = /room/index.html { expires -1; }
    location = /index.html { expires -1; }
    location ~ ^/room/assets/.*\.(js|css)$ { try_files $uri =404; expires 365d; }
    location ~* \.(png|svg|json|vroom|css|txt|xml)$ { try_files $uri =404; expires 1h; }
    location /room/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
